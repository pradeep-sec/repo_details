name: Export GitHub Repos To Excel

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest

    steps:
      - name: Check out workflow repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests openpyxl

      - name: Export repo data to Excel
        env:
          GH_ACCOUNT_READ_TOKEN: ${{ secrets.GH_ACCOUNT_READ_TOKEN }}
        run: python scripts/export_github_repos_to_excel.py

      - name: Upload Excel file
        uses: actions/upload-artifact@v4
        with:
          name: github-repo-export
          path: output/*.xlsx
          if-no-files-found: error
